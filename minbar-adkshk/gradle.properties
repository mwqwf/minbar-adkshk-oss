# لغة JVM إنجليزية إلزامياً أثناء البناء: على نظام عربي تُولّد bundletool
# أسماء dex بأرقام عربية-هندية (classes٢.dex) فيفشل packageReleaseBundle.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# «ميزة تقليص الموارد المحسَّنة غير مفعَّلة» — تحذير فحص Play (الجودة الفنية).
# تجعل R8 يقلّص الموارد بتحليل أدقّ لمراجع R، فتُزال موارد لا يصل إليها كود
# حيّ ويصغُر resources.arsc. الافتراضي في AGP 9، ويُفعَّل صراحةً قبله.
android.r8.optimizedResourceShrinking=true

# خدمة Kotlin daemon تفشل على هذا الجهاز — صرِّف داخل العمليّة.
kotlin.compiler.execution.strategy=in-process
