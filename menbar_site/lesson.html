<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>درس صوتي — منبر ادكصهك</title>
<meta name="description" content="استمع إلى هذا الدرس داخل تطبيق منبر ادكصهك — أرشيف صوتي للدروس العلمية."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root{--teal:#247172;--teal-dark:#184b4b;--bg:#f8fcfc;--gold:#d4af37}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Cairo,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:#123;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .card{background:#fff;border:1px solid #dcebeb;border-radius:24px;max-width:440px;width:100%;
        padding:40px 28px;box-shadow:0 12px 40px rgba(24,75,75,.10)}
  .logo{width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,var(--teal),var(--teal-dark));
        display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
  .logo svg{width:40px;height:40px;fill:#fff}
  h1{font-size:22px;color:var(--teal-dark);margin-bottom:8px}
  p{font-size:15px;line-height:1.9;color:#456;margin-bottom:22px}
  .btn{display:block;width:100%;padding:14px 18px;border-radius:14px;font-size:16px;font-weight:700;
       text-decoration:none;margin-bottom:10px}
  .btn-primary{background:var(--teal);color:#fff}
  .btn-secondary{background:#eaf4f4;color:var(--teal-dark)}
  .hint{font-size:12.5px;color:#8aa;margin-top:14px}
  footer{margin-top:28px;font-size:12.5px;color:#9ab}
  footer a{color:var(--teal);text-decoration:none}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M12 3a4 4 0 0 1 4 4v5a4 4 0 0 1-8 0V7a4 4 0 0 1 4-4zm-6 9a6 6 0 0 0 12 0h2a8 8 0 0 1-7 7.94V22h-2v-2.06A8 8 0 0 1 4 12h2z"/></svg>
    </div>
    <h1>هذا درس صوتي من منبر ادكصهك</h1>
    <p>إن كان التطبيق مثبَّتاً على جهازك فسيُفتح الدرس مباشرة عند النقر على الرابط.
       وإن لم يكن مثبَّتاً بعد، حمّله أولاً ثم افتح الرابط من جديد.</p>
    <a class="btn btn-primary" href="/#download">حمّل تطبيق منبر ادكصهك</a>
    <a class="btn btn-secondary" href="/">تعرّف على المنصّة</a>
    <div class="hint">أرشيف صوتي للدروس العلمية — بلا حساب، بلا إعلانات.</div>
  </div>
  <footer>© 2026 منبر ادكصهك · <a href="/privacy">سياسة الخصوصية</a></footer>
</body>
</html>
